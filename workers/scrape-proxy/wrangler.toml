name = "oh-my-scrap-proxy"
main = "src/index.js"
compatibility_date = "2025-03-01"
workers_dev = true
preview_urls = false

[vars]
# 쉼표(,)로 구분된 허용 Origin 목록. 비워두면 기본값(Firebase 호스팅 도메인 및 localhost)이 적용됩니다.
ALLOWED_ORIGINS = "https://oh-my-scrap.web.app,https://oh-my-scrap.firebaseapp.com,http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173"
# 엣지 캐시 유지 시간(초)
CACHE_TTL_SECONDS = "300"
# 최대 응답 본문 크기(바이트) - 2MB
MAX_RESPONSE_BYTES = "2097152"
